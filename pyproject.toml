[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoreel"
version = "0.1.0"
description = "Modular source-referenced editing pipeline"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["jsonschema>=4.18,<5", "pytest>=8,<9"]
transcription = ["jsonschema>=4.18,<5", "faster-whisper>=1.1,<2"]
autocam = ["jsonschema>=4.18,<5", "opencv-python-headless>=4.10,<5", "numpy>=1.26,<3"]

[project.scripts]
autoreel-ingest = "modules.m0_ingest.cli:main"
autoreel-transcribe = "modules.m1_transcription.cli:main"
autoreel-speechcut = "modules.m2_speechcut.cli:main"
autoreel-smartedit = "modules.m3_smartedit.cli:main"
autoreel-autocam = "modules.m4_autocam.cli:main"
autoreel-visual-planner = "modules.m5_visual_planner.cli:main"
autoreel-sounddesign = "modules.m7_sounddesign.cli:main"
autoreel-music = "modules.m8_music.cli:main"
autoreel-assets = "modules.m6_asset_manager.cli:main"
autoreel-timeline-pass-a = "modules.m10_timeline_compiler.cli:main"

[tool.setuptools.packages.find]
include = ["core*", "modules*"]

[tool.setuptools.package-data]
core = ["schemas/*.json"]
